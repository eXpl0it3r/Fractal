name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Windows VS2026, os: windows-2025 }
          - { name: Linux GCC,      os: ubuntu-26.04 }
          - { name: Linux Clang,    os: ubuntu-26.04, flags: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ }
          - { name: macOS Xcode,    os: macos-26 }

    steps:
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
             sudo apt-get update
             sudo apt-get install libx11-dev libxrandr-dev libxcursor-dev libudev-dev libopenal-dev libflac-dev libvorbis-dev libfreetype-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Fractal - Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: SFML - Checkout Code
        uses: actions/checkout@v7
        with:
          repository: SFML/SFML
          path: SFML
          ref: 2.6.x
          persist-credentials: false

      - name: SFML - Configure CMake
        env:
          CMAKE_FLAGS: ${{ matrix.platform.flags }}
        run: cmake -S "$GITHUB_WORKSPACE/SFML" -B "$GITHUB_WORKSPACE/SFML/build" -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/SFML/install" -DCMAKE_VERBOSE_MAKEFILE=ON -DBUILD_SHARED_LIBS=ON $CMAKE_FLAGS

      - name: SFML - Build
        run: cmake --build "$GITHUB_WORKSPACE/SFML/build" --config Release --target install

      - name: Fractal - Configure CMake
        env:
          CMAKE_FLAGS: ${{ matrix.platform.flags }}
        run: cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" -DCMAKE_VERBOSE_MAKEFILE=ON -DSFML_DIR="$GITHUB_WORKSPACE/SFML/install/lib/cmake/SFML" -DFRACTAL_STATIC_LINKING=OFF $CMAKE_FLAGS

      - name: Fractal - Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --config Release --target install
